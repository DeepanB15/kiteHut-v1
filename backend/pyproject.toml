[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitehut"
version = "0.1.0"
description = "Local-first repository intelligence & evidence engine: graph, context, evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["repository", "code-graph", "knowledge", "evidence", "mcp", "ai-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0",
    "colorama>=0.4",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.3",
    "python-dotenv>=1.0",
    "GitPython==3.1.44",
    "langgraph<2.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "httpx>=0.27",
    "reportlab>=4.2",
    "mcp>=1.2,<2.0",
    "networkx>=3.2,<4",
]

[project.scripts]
kitehut = "app.cli.main:main"
# Deprecated alias kept for backward compatibility with the former RepoLens name.
repolens = "app.cli.main:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "workspace*", ".venv*", ".git*"]

[tool.setuptools.package-dir]
"" = "."
